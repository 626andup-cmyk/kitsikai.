<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice">
<!--
  Liquid Glass Dark's neon: ribbons of electric blue, hot pink and purple
  light that sweep across the screen and curl over. Each is drawn three
  times: a wide soft glow, the coloured tube, and a thin white-hot core, so
  the glass has bright lines to bend and split at its edges.
-->
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>

  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f5bff"/>
    <stop offset="0.5" stop-color="#22d3ff"/>
    <stop offset="1" stop-color="#6b4dff"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2bd6"/>
    <stop offset="0.55" stop-color="#ff4f9a"/>
    <stop offset="1" stop-color="#b637ff"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9b30ff"/>
    <stop offset="0.6" stop-color="#6a4dff"/>
    <stop offset="1" stop-color="#ff2bd6"/>
  </linearGradient>

  <!-- A blue ribbon across the top that loops over itself in the middle. -->
  <path id="ribbon-blue" d="M-120 420 C 250 250, 520 330, 640 470 C 760 610, 700 760, 580 740 C 460 720, 470 560, 620 520 C 820 470, 1100 620, 1720 380"/>
  <!-- A pink ribbon low down, with a curl at the right. -->
  <path id="ribbon-pink" d="M-120 1180 C 300 1000, 600 1250, 900 1120 S 1300 860, 1450 980 C 1560 1070, 1500 1200, 1400 1180 C 1300 1160, 1330 1040, 1450 1030 C 1560 1020, 1650 1100, 1720 1160"/>
  <!-- A purple ribbon falling down the right-hand side. -->
  <path id="ribbon-purple" d="M1180 -120 C 1000 250, 1300 520, 1120 800 S 820 1150, 980 1400 S 1100 1650, 1000 1720"/>
  <!-- A fine cyan thread through the middle. -->
  <path id="thread" d="M-60 820 C 300 720, 500 970, 800 880 S 1300 720, 1660 840"/>
</defs>

<g fill="none" stroke-linecap="round">
  <!-- Glows. -->
  <g filter="url(#glow)" opacity="0.75">
    <use href="#ribbon-blue" xlink:href="#ribbon-blue" stroke="url(#blue)" stroke-width="80"/>
    <use href="#ribbon-pink" xlink:href="#ribbon-pink" stroke="url(#pink)" stroke-width="72"/>
    <use href="#ribbon-purple" xlink:href="#ribbon-purple" stroke="url(#purple)" stroke-width="56"/>
    <use href="#thread" xlink:href="#thread" stroke="#22d3ff" stroke-width="18"/>
  </g>
  <!-- Tubes. -->
  <use href="#ribbon-blue" xlink:href="#ribbon-blue" stroke="url(#blue)" stroke-width="34"/>
  <use href="#ribbon-pink" xlink:href="#ribbon-pink" stroke="url(#pink)" stroke-width="30"/>
  <use href="#ribbon-purple" xlink:href="#ribbon-purple" stroke="url(#purple)" stroke-width="22"/>
  <use href="#thread" xlink:href="#thread" stroke="#5fe4ff" stroke-width="4"/>
  <!-- White-hot cores. -->
  <g stroke="#ffffff" opacity="0.85">
    <use href="#ribbon-blue" xlink:href="#ribbon-blue" stroke-width="6"/>
    <use href="#ribbon-pink" xlink:href="#ribbon-pink" stroke-width="5"/>
    <use href="#ribbon-purple" xlink:href="#ribbon-purple" stroke-width="4"/>
  </g>
</g>
</svg>
